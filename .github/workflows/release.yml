name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runs_on: macos-15-intel
            artifact_name: macos-intel
            is_macos: true
            mac_arch: x64
          - name: macOS Apple Silicon
            runs_on: macos-15
            artifact_name: macos-arm64
            is_macos: true
            mac_arch: arm64
          - name: Windows x64
            runs_on: windows-latest
            artifact_name: windows-x64
            is_macos: false
          - name: Linux x64
            runs_on: ubuntu-latest
            artifact_name: linux-x64
            is_macos: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify macOS signing secrets
        if: matrix.is_macos && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          missing=()
          for key in CSC_LINK CSC_KEY_PASSWORD APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required macOS signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Prepare App Store Connect API key
        if: matrix.is_macos && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/appstoreconnect"
          key_path="$RUNNER_TEMP/appstoreconnect/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_PROFILE=mqttboard-notarytool" >> "$GITHUB_ENV"

      - name: Validate App Store Connect API key
        if: matrix.is_macos && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          if [ -z "${APPLE_API_KEY:-}" ] || [ ! -f "$APPLE_API_KEY" ]; then
            echo "Missing App Store Connect API key file on runner. Prepare step did not produce APPLE_API_KEY."
            exit 1
          fi

          if ! grep -q "BEGIN PRIVATE KEY" "$APPLE_API_KEY"; then
            echo "App Store Connect private key is malformed. Expected a .p8 PEM with BEGIN PRIVATE KEY header."
            exit 1
          fi

          echo "Validating App Store Connect credentials with notarytool..."
          if ! xcrun notarytool store-credentials "$APPLE_KEYCHAIN_PROFILE" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPSTORE_KEY_ID" \
            --issuer "$APPSTORE_ISSUER_ID" \
            --validate; then
            echo "App Store Connect credential validation failed. Check APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_PRIVATE_KEY and App Manager access."
            exit 1
          fi

      - name: Build desktop app (macOS signed)
        if: matrix.is_macos && startsWith(github.ref, 'refs/tags/')
        run: npm run build:desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_KEYCHAIN_PROFILE: ${{ env.APPLE_KEYCHAIN_PROFILE }}

      - name: Build desktop app (macOS unsigned)
        if: matrix.is_macos && !startsWith(github.ref, 'refs/tags/')
        run: npm run build:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build desktop app (Windows/Linux)
        if: ${{ !matrix.is_macos }}
        run: npm run build:desktop

      - name: Stage release artifacts
        run: npm run stage:release -- dist release

      - name: Verify macOS disk images
        if: matrix.is_macos
        shell: bash
        env:
          MAC_ARCH: ${{ matrix.mac_arch }}
        run: |
          set -euo pipefail

          dmg_files=()
          while IFS= read -r dmg_file; do
            dmg_files+=("$dmg_file")
          done < <(find release -maxdepth 1 -type f -name '*.dmg' | sort)

          # Each macOS runner must produce exactly one dmg for its own arch.
          # Building both arches here makes two jobs emit the same file name,
          # which download-artifact then merges into one corrupted file.
          if [ ${#dmg_files[@]} -ne 1 ]; then
            echo "Expected exactly one .dmg for $MAC_ARCH, got ${#dmg_files[@]}:"
            find release -maxdepth 1 -type f -name '*.dmg' | sort | sed 's/^/  /'
            exit 1
          fi

          dmg_file="${dmg_files[0]}"
          dmg_name="$(basename "$dmg_file")"

          case "$MAC_ARCH:$dmg_name" in
            arm64:*-arm64.dmg) ;;
            x64:*-arm64.dmg)
              echo "Intel runner produced an arm64 image: $dmg_name"
              exit 1
              ;;
            x64:*) ;;
            *)
              echo "Apple Silicon runner produced a non-arm64 image: $dmg_name"
              exit 1
              ;;
          esac

          echo "Verifying $dmg_file"
          hdiutil verify "$dmg_file"

          mount_point="$(mktemp -d)"
          hdiutil attach "$dmg_file" -readonly -nobrowse -noautoopen -mountpoint "$mount_point"
          ls "$mount_point"
          hdiutil detach "$mount_point"

      - name: Record artifact checksums
        run: node scripts/verify-release-artifacts.js write release ${{ matrix.artifact_name }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/
          compression-level: 0
          if-no-files-found: error

      - name: Cleanup macOS notarization credentials
        if: always() && matrix.is_macos
        shell: bash
        run: |
          if [ -n "${APPLE_KEYCHAIN_PROFILE:-}" ]; then
            xcrun notarytool delete-credentials "$APPLE_KEYCHAIN_PROFILE" >/dev/null 2>&1 || true
          fi

          if [ -n "${APPLE_API_KEY:-}" ] && [ -f "$APPLE_API_KEY" ]; then
            rm -f "$APPLE_API_KEY"
          fi

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Merge release artifacts and update metadata
        run: node scripts/merge-release-artifacts.js release-artifacts release

      - name: Show collected files
        run: find release -maxdepth 2 -type f | sort

      - name: Validate downloaded release assets
        run: node scripts/verify-release-artifacts.js check release

      - name: Verify tag release context
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$REF" != refs/tags/* ]]; then
            echo "Expected a tag ref, got: $REF"
            exit 1
          fi

          if [[ -z "$TAG" || ! "$TAG" =~ ^v ]]; then
            echo "Expected tag name starting with v, got: $TAG"
            exit 1
          fi

          git fetch --force --tags origin
          TAG_SHA="$(git rev-list -n 1 "$TAG")"

          if [[ -z "$TAG_SHA" ]]; then
            echo "Tag $TAG is not available after fetching tags."
            exit 1
          fi

          # For an annotated tag github.sha can be the tag object rather than
          # the commit, so compare both sides after dereferencing.
          REF_SHA="$(git rev-parse "${SHA}^{commit}")"

          if [[ "$TAG_SHA" != "$REF_SHA" ]]; then
            echo "Tag $TAG resolves to $TAG_SHA but workflow is running for $REF_SHA"
            exit 1
          fi

          echo "Verified tag context for $TAG at $TAG_SHA"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --target "$SHA" \
              --draft \
              --generate-notes \
              --title "$TAG"
          fi

      - name: Remove obsolete release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Anything already attached that this run is not about to upload is
          # left over from an older attempt, including assets whose file name
          # changed between releases.
          find release -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/expected-assets.txt

          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | while IFS= read -r asset_name; do
            if ! grep -Fxq "$asset_name" /tmp/expected-assets.txt; then
              echo "Deleting obsolete asset: $asset_name"
              gh release delete-asset "$TAG" "$asset_name" --repo "$REPO" --yes
            fi
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(find release -maxdepth 1 -type f | sort)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets to upload."
            exit 1
          fi

          gh release upload "$TAG" "${assets[@]}" --repo "$REPO" --clobber

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          rm -rf verify
          gh release download "$TAG" --repo "$REPO" --dir verify --clobber

          node scripts/verify-release-artifacts.js verify release/SHA256SUMS.txt verify

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false
